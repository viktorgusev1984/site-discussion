server { listen 80; root /usr/share/nginx/html; index index.html; location /api/agent/ { proxy_pass http://backend:8080/api/agent/; proxy_set_header Host $host; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 300s; proxy_send_timeout 300s; } location /api/ { proxy_pass http://backend:8080/api/; proxy_set_header Host $host; proxy_read_timeout 300s; proxy_send_timeout 300s; } location / { try_files $uri /index.html; } }
