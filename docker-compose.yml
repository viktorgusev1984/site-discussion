services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discussions}
      POSTGRES_USER: ${POSTGRES_USER:-discussions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-discussions}
      DATABASE_USER: ${POSTGRES_USER:-discussions}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_TTL: ${JWT_TTL:-PT24H}
      NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY:?Set NOTIFICATION_ENCRYPTION_KEY in .env}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["${BACKEND_PORT:-8080}:8080"]
  frontend:
    build: {context: ./frontend, args: {VITE_API_URL: /api}}
    depends_on: [backend]
    ports: ["${FRONTEND_PORT:-3000}:80"]
volumes:
  postgres_data:
