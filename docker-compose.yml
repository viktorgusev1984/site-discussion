services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discussions}
      POSTGRES_USER: ${POSTGRES_USER:-discussions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-discussions}
      DATABASE_USER: ${POSTGRES_USER:-discussions}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_TTL: ${JWT_TTL:-PT24H}
      NOTIFICATION_ENCRYPTION_KEY: ${NOTIFICATION_ENCRYPTION_KEY:?Set NOTIFICATION_ENCRYPTION_KEY in .env}
      NOTIFICATION_WORKER_INTERVAL: ${NOTIFICATION_WORKER_INTERVAL:-10s}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      NOTIFICATION_INITIAL_BACKOFF: ${NOTIFICATION_INITIAL_BACKOFF:-30s}
      NOTIFICATION_CONNECT_TIMEOUT: ${NOTIFICATION_CONNECT_TIMEOUT:-3s}
      NOTIFICATION_READ_TIMEOUT: ${NOTIFICATION_READ_TIMEOUT:-5s}
      NOTIFICATION_MAX_RESPONSE_BYTES: ${NOTIFICATION_MAX_RESPONSE_BYTES:-65536}
      NOTIFICATION_MAX_REDIRECTS: ${NOTIFICATION_MAX_REDIRECTS:-2}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["${BACKEND_PORT:-8080}:8080"]
  frontend:
    build: {context: ./frontend, args: {VITE_API_URL: /api}}
    depends_on: [backend]
    ports: ["${FRONTEND_PORT:-3000}:80"]
volumes:
  postgres_data:
