services:
  - type: web
    name: open-ideas-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/categories
    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: open-ideas-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: open-ideas-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: open-ideas-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: open-ideas-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: open-ideas-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: NOTIFICATION_ENCRYPTION_KEY
        generateValue: true
      - key: NOTIFICATION_WORKER_INTERVAL
        value: 10s
      - key: NOTIFICATION_MAX_ATTEMPTS
        value: "5"
      - key: NOTIFICATION_CONNECT_TIMEOUT
        value: 3s
      - key: NOTIFICATION_READ_TIMEOUT
        value: 5s
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_AUTH
        value: "true"
      - key: SMTP_STARTTLS
        value: "true"
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://open-ideas.onrender.com
      - key: QWEN_AGENT_INTERNAL_URL
        value: http://open-ideas-qwen:4170
      - fromGroup: open-ideas-qwen-auth

  - type: web
    name: open-ideas-qwen
    runtime: docker
    rootDir: qwen-agent
    plan: free
    envVars:
      - key: PORT
        value: "4170"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      - key: OPENAI_MODEL
        value: qwen3-coder-plus
      - fromGroup: open-ideas-qwen-auth

  - type: web
    name: open-ideas
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://open-ideas-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: open-ideas-db
    plan: free
    databaseName: discussions
    user: discussions

envVarGroups:
  - name: open-ideas-qwen-auth
    envVars:
      - key: QWEN_SERVER_TOKEN
        generateValue: true
